<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15251f" />
  <title>Etxeak — MVP-0</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="game-shell">
    <header class="map-header">
      <div>
        <p class="eyebrow">ETXEAK · MVP-0</p>
        <h1>One House</h1>
      </div>
      <div class="season-chip" aria-label="Prototype season">Spring · 1100</div>
    </header>

    <section class="map-stage" aria-label="MVP-0 regional map">
      <div id="map"></div>
      <div class="scope-card">
        <strong>MVP-0 region</strong>
        <span>Gipuzkoa and the adjoining northern Navarre valleys</span>
      </div>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./app.js"></script>
</body>
</html>
